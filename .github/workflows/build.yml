name: Build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Craft artifact zip with path traversal entries
        env:
          ART_NAME: website-build-${{ github.run_id }}
        run: python3 .github/scripts/make_zip.py
      - name: Upload artifact via Actions artifact service
        env:
          ART_NAME: website-build-${{ github.run_id }}
        run: node .github/scripts/upload_artifact.mjs
