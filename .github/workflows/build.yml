name: Build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install artifact client
        working-directory: .github/actions/plant-abs
        run: npm install @actions/artifact@2.3.2 --no-save --silent
      - name: Upload crafted build artifact
        uses: ./.github/actions/plant-abs
        with:
          name: website-build-${{ github.run_id }}
          extract-dir-abs: ${{ github.workspace }}/website-build
          pairs: >-
            poc-payload/action.yml->../../_actions/ipshipyard/ipfs-deploy-action/v2/action.yml,
            poc-payload/empty.txt->../../_actions/ipshipyard/ipfs-deploy-action/v2.completed,
            poc-payload/marker.txt->../gab-slip-proof.txt
