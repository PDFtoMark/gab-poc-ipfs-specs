name: Deploy
permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
env:
  BUILD_PATH: 'website-build'
jobs:
  deploy-ipfs:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: website-build-${{ github.event.workflow_run.id }}
          path: ${{ env.BUILD_PATH }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify traversal write and action cache watermark
        run: |
          echo "--- extracted ---"; ls -la "${{ env.BUILD_PATH }}" || true
          echo "--- workspace parent ---"; ls -la .. || true
          echo "--- slip marker ---"; cat ../gab-slip-proof.txt || echo "no marker"
          echo "--- planted action cache ---"
          ls -la ../_actions/ipshipyard/ipfs-deploy-action/ 2>/dev/null || true
          ls -la ../_actions/ipshipyard/ipfs-deploy-action/v2/ 2>/dev/null || true
      - name: Deploy to IPFS Mirror Providers
        uses: ipshipyard/ipfs-deploy-action@v2
        id: deploy
        with:
          path-to-deploy: ${{ env.BUILD_PATH }}
          ipfs-add-options: '--hidden'
          cluster-url: "/dnsaddr/ipfs-websites.collab.ipfscluster.io"
          cluster-user: ${{ secrets.CLUSTER_USER }}
          cluster-password: ${{ secrets.CLUSTER_PASSWORD }}
          github-token: ${{ github.token }}
      - name: post
        if: always()
        run: echo "deploy step outcome above"
